<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="dark" />
    <link rel="icon" href="data:," />
    <title>November Meal Plan</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;800;900&family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet" />
    <style>
      button, [role="button"], select, summary, input:not([type="checkbox"], [type="radio"]) { min-height: 2rem; }
      * { box-sizing: border-box; }
      :root {
        --plum: #241536;
        --plum-deep: #150c24;
        --gold: #f2c14e;
        --gold-soft: #eec27a;
        --orange: #e07b24;
        --orange-deep: #bc550d;
        --cream: #fdf7ea;
        --cream-dim: #f3e8d2;
        --ink: #3a2415;
        --ink-soft: #71563d;
        --teal: #175d6e;
        --teal-deep: #0e3d49;
        --brown-pill: #8a5a2b;
        --red: #c8451b;
      }
      html, body { margin: 0; padding: 0; }
      body {
        font-family: "Nunito", system-ui, sans-serif;
        background:
          radial-gradient(1100px 480px at 50% -120px, #4a2358 0%, rgba(74,35,88,0) 60%),
          radial-gradient(700px 300px at 85% 0%, rgba(224,123,36,.28) 0%, rgba(224,123,36,0) 60%),
          linear-gradient(180deg, var(--plum) 0%, var(--plum-deep) 100%);
        background-attachment: fixed;
        color: var(--cream);
        min-height: 100vh;
      }
      .wrap { max-width: 1240px; margin: 0 auto; padding: 20px 16px 40px; }

      /* ---------- Header ---------- */
      header { text-align: center; padding: 14px 8px 4px; position: relative; }
      .leaf { position: absolute; top: 6px; width: 44px; height: 44px; opacity: .9; }
      .leaf.left { left: 4%; transform: rotate(-18deg); }
      .leaf.right { right: 4%; transform: scaleX(-1) rotate(-18deg); }
      @media (max-width: 640px) { .leaf { display: none; } }
      h1 {
        font-family: "Playfair Display", Georgia, serif;
        font-weight: 900;
        font-size: clamp(30px, 6.2vw, 58px);
        letter-spacing: .06em;
        margin: 0;
        color: var(--gold);
        text-shadow: 0 2px 0 rgba(0,0,0,.35), 0 0 26px rgba(242,193,78,.25);
      }
      .week-range {
        margin-top: 6px;
        font-weight: 800;
        letter-spacing: .42em;
        font-size: clamp(12px, 2.4vw, 16px);
        color: var(--cream);
        text-indent: .42em;
      }
      .hint { margin: 10px 0 0; color: var(--cream-dim); font-size: 14.5px; font-weight: 600; }

      /* ---------- Week switcher ---------- */
      .week-nav {
        display: flex; align-items: center; justify-content: center; gap: 12px;
        margin: 18px 0 20px; flex-wrap: wrap;
      }
      .week-nav button {
        font-family: inherit; font-weight: 800; font-size: 15px;
        color: var(--gold); background: rgba(242,193,78,.08);
        border: 2px solid rgba(242,193,78,.55); border-radius: 999px;
        padding: 10px 18px; min-height: 44px; cursor: pointer;
      }
      .week-nav button:hover:not(:disabled) { background: rgba(242,193,78,.2); }
      .week-nav button:disabled { opacity: .35; cursor: default; }
      .week-nav .wk-label { font-weight: 900; font-size: 16px; letter-spacing: .04em; color: var(--cream); min-width: 190px; text-align: center; }

      /* ---------- Day grid ---------- */
      .week-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 12px; }
      @media (max-width: 1080px) { .week-grid { grid-template-columns: repeat(4, 1fr); } }
      @media (max-width: 700px)  { .week-grid { grid-template-columns: repeat(2, 1fr); gap: 10px; } }
      /* Phones: single-column list of big, easy-to-tap day cards */
      @media (max-width: 560px) {
        .week-grid { grid-template-columns: 1fr; gap: 10px; }
        .card { padding: 24px 16px 20px; }
        .card .icon { width: 68px; height: 68px; }
        .card .meal { font-size: 20px; }
        .card .side { font-size: 15px; }
        .card .date-num { font-size: 21px; }
        .wk-label { min-width: 0; }
      }
      .day { display: flex; flex-direction: column; gap: 8px; min-width: 0; }
      .dow {
        background: linear-gradient(180deg, #ec8a30, var(--orange));
        color: #fff; font-weight: 900; letter-spacing: .22em; text-indent: .22em;
        text-align: center; padding: 8px 4px; border-radius: 9px; font-size: 14px;
        box-shadow: 0 2px 6px rgba(0,0,0,.35);
      }
      .card {
        position: relative; flex: 1; width: 100%;
        font-family: inherit; text-align: center; cursor: pointer;
        background: var(--cream); color: var(--ink);
        border: none; border-radius: 14px;
        padding: 30px 10px 16px;
        box-shadow: 0 4px 14px rgba(0,0,0,.4);
        display: flex; flex-direction: column; align-items: center; gap: 4px;
      }
      .card:hover { filter: brightness(1.04); }
      .card:focus-visible, .week-nav button:focus-visible, .modal-close:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }
      .card .date-num {
        position: absolute; top: 9px; left: 12px;
        font-weight: 900; font-size: 19px; color: var(--red);
      }
      .card .icon { width: 62px; height: 62px; margin: 2px 0 4px; }
      .card .icon svg { width: 100%; height: 100%; display: block; }
      .card .meal { font-weight: 900; font-size: 17.5px; line-height: 1.18; }
      .card .side { font-size: 13.5px; font-weight: 700; color: var(--ink-soft); line-height: 1.3; }
      .pill {
        margin-top: 8px; display: inline-block;
        background: var(--brown-pill); color: #ffe9c9;
        font-size: 10.5px; font-weight: 900; letter-spacing: .14em;
        padding: 5px 10px; border-radius: 999px;
      }
      .today-badge {
        position: absolute; top: 9px; right: 10px;
        background: var(--red); color: #fff;
        font-size: 10px; font-weight: 900; letter-spacing: .12em;
        padding: 4px 8px; border-radius: 999px;
      }
      .card.is-today { box-shadow: 0 0 0 3px var(--gold), 0 4px 14px rgba(0,0,0,.4); }

      /* Movie night card */
      .card.movie {
        background: linear-gradient(180deg, var(--teal) 0%, var(--teal-deep) 100%);
        color: #fff;
      }
      .card.movie .date-num { color: var(--gold); }
      .card.movie .movie-name {
        font-family: "Playfair Display", Georgia, serif; font-weight: 800;
        color: var(--gold); font-size: 20px; letter-spacing: .05em; line-height: 1.1;
      }
      .card.movie .side { color: #cfe6ea; }
      .card.movie .pill { background: rgba(255,255,255,.16); color: #fff; }

      /* Thanksgiving card */
      .card.feast {
        background: linear-gradient(180deg, #ec8a30 0%, var(--orange-deep) 100%);
        color: #fff;
      }
      .card.feast .date-num { color: #fff; }
      .card.feast .feast-label {
        font-family: "Playfair Display", Georgia, serif; font-weight: 800;
        letter-spacing: .1em; font-size: 16.5px; color: #fff;
      }
      .card.feast .side { color: #ffe3c2; }

      /* ---------- Modal ---------- */
      .backdrop {
        position: fixed; inset: 0; z-index: 50;
        background: rgba(12, 6, 22, .72);
        display: none; align-items: flex-start; justify-content: center;
        padding: 18px 12px; overflow-y: auto;
      }
      .backdrop.open { display: flex; }
      .modal {
        background: var(--cream); color: var(--ink);
        border-radius: 18px; width: 100%; max-width: 620px;
        padding: 26px 26px 30px; position: relative;
        box-shadow: 0 18px 50px rgba(0,0,0,.55);
        margin: auto 0;
      }
      @media (max-width: 560px) { .modal { padding: 22px 18px 26px; } }
      .modal-close {
        position: absolute; top: 12px; right: 12px;
        width: 42px; height: 42px; border-radius: 50%;
        border: none; background: var(--orange); color: #fff;
        font-size: 20px; font-weight: 900; cursor: pointer; line-height: 1;
      }
      .modal .m-date { font-weight: 900; letter-spacing: .18em; font-size: 12.5px; color: var(--red); }
      .modal h2 { font-family: "Playfair Display", Georgia, serif; font-size: 27px; margin: 4px 44px 2px 0; line-height: 1.15; }
      .modal .m-sub { color: var(--ink-soft); font-weight: 700; font-size: 15px; margin: 0 0 12px; }
      .chips { display: flex; gap: 8px; flex-wrap: wrap; margin: 10px 0 4px; }
      .chip {
        background: #f3e3c3; border-radius: 10px; padding: 7px 12px;
        font-size: 13.5px; font-weight: 800; color: var(--ink);
      }
      .chip span { color: var(--ink-soft); font-weight: 700; }
      .movie-box {
        background: linear-gradient(180deg, var(--teal), var(--teal-deep));
        color: #fff; border-radius: 12px; padding: 14px 16px; margin: 14px 0 4px;
      }
      .movie-box .mb-label { font-size: 11px; font-weight: 900; letter-spacing: .2em; color: var(--gold-soft); }
      .movie-box .mb-name { font-family: "Playfair Display", Georgia, serif; font-size: 23px; font-weight: 800; color: var(--gold); margin: 2px 0; }
      .movie-box .mb-meta { font-size: 13.5px; font-weight: 700; color: #cfe6ea; }
      .movie-box p { margin: 6px 0 0; font-size: 14.5px; line-height: 1.45; }
      .modal h3 {
        font-size: 14px; letter-spacing: .16em; font-weight: 900;
        color: var(--orange-deep); margin: 20px 0 8px;
        border-bottom: 2px solid #eed9ae; padding-bottom: 5px;
      }
      .modal ul, .modal ol { margin: 0; padding-left: 22px; }
      .modal li { font-size: 15.5px; line-height: 1.5; margin-bottom: 5px; }
      .modal .sides-list { list-style: none; padding-left: 0; }
      .modal .sides-list li { margin-bottom: 9px; }
      .modal .sides-list b { color: var(--ink); }
      .modal .sides-list .how { color: var(--ink-soft); font-weight: 600; }
      /* Phones: recipe popup goes full-screen with its own scrolling and a big close button */
      @media (max-width: 640px) {
        .backdrop { padding: 0; overflow: hidden; }
        .modal {
          max-width: none; width: 100%; height: 100dvh; max-height: 100dvh;
          border-radius: 0; margin: 0; overflow-y: auto; -webkit-overflow-scrolling: touch;
          padding: 24px 20px 40px;
        }
        .modal-close {
          position: fixed; top: 12px; right: 12px; z-index: 5;
          width: 52px; height: 52px; font-size: 28px;
          box-shadow: 0 4px 14px rgba(0,0,0,.35);
        }
        .modal h2 { font-size: 25px; }
        .modal li { font-size: 16px; }
      }
      footer { text-align: center; color: rgba(253,247,234,.5); font-size: 13px; font-weight: 600; margin-top: 26px; }
    </style>
  </head>
  <body>
    <div class="wrap">
      <header>
        <svg class="leaf left" viewBox="0 0 48 48" aria-hidden="true"><path d="M24 4C12 12 6 24 8 40c14 2 26-4 34-16C34 22 28 12 24 4Z" fill="#e07b24"/><path d="M12 36C18 26 28 16 38 10" stroke="#bc550d" stroke-width="2.4" fill="none" stroke-linecap="round"/></svg>
        <svg class="leaf right" viewBox="0 0 48 48" aria-hidden="true"><path d="M24 4C12 12 6 24 8 40c14 2 26-4 34-16C34 22 28 12 24 4Z" fill="#c8451b"/><path d="M12 36C18 26 28 16 38 10" stroke="#8f2f10" stroke-width="2.4" fill="none" stroke-linecap="round"/></svg>
        <h1>NOVEMBER MEAL PLAN</h1>
        <div class="week-range" id="weekRange"></div>
        <p class="hint">Tap any day to see the full recipe.</p>
      </header>

      <nav class="week-nav" aria-label="Choose a week">
        <button type="button" id="prevWeek" aria-label="Previous week">&#8592; Prev week</button>
        <div class="wk-label" id="wkLabel"></div>
        <button type="button" id="nextWeek" aria-label="Next week">Next week &#8594;</button>
      </nav>

      <main>
        <div class="week-grid" id="weekGrid"></div>
      </main>

      <footer>Dinner at home, one week at a time.</footer>
    </div>

    <div class="backdrop" id="backdrop" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
      <div class="modal" id="modal">
        <button type="button" class="modal-close" id="modalClose" aria-label="Close recipe">&times;</button>
        <div id="modalBody"></div>
      </div>
    </div>

      /* ---------- Meal data ---------- */
      var WEEKS = [
        {
          label: "Week of Nov 15",
          range: "NOV 15 &middot; NOV 21",

            {

      /* ---------- Rendering ---------- */
      var grid = document.getElementById("weekGrid");
      var wkLabel = document.getElementById("wkLabel");
      var weekRange = document.getElementById("weekRange");
      var prevBtn = document.getElementById("prevWeek");
      var nextBtn = document.getElementById("nextWeek");
      var current = 0;

      function todayIso() {
        var d = new Date();
        var m = String(d.getMonth() + 1).padStart(2, "0");
        var day = String(d.getDate()).padStart(2, "0");
        return d.getFullYear() + "-" + m + "-" + day;
      }

      /* Open on the week that contains today, if we have it. */
      (function () {
        var t = todayIso();
        for (var i = 0; i < WEEKS.length; i++) {
          var days = WEEKS[i].days;
          if (t >= days[0].iso && t <= days[days.length - 1].iso) { current = i; break; }
          if (t < days[0].iso) { current = i; break; }
          current = i;
        }
      })();

      function renderWeek() {
        var week = WEEKS[current];
        wkLabel.textContent = week.label;
        weekRange.innerHTML = week.range;
        prevBtn.disabled = current === 0;
        nextBtn.disabled = current === WEEKS.length - 1;
        var t = todayIso();
        grid.innerHTML = "";
        week.days.forEach(function (d, idx) {
          var wrap = document.createElement("div");
          wrap.className = "day";
          var dow = document.createElement("div");
          dow.className = "dow";
          dow.textContent = d.dow;
          var btn = document.createElement("button");
          btn.type = "button";
          btn.className = "card" + (d.type ? " " + d.type : "") + (d.iso === t ? " is-today" : "");
          btn.setAttribute("aria-label", d.dow + " November " + d.date + ": " + btnText(d.meal) + ". Tap for recipe.");
          var html = '<span class="date-num">' + d.date + "</span>";
          if (d.iso === t) html += '<span class="today-badge">TODAY</span>';
          html += '<span class="icon">' + (ICONS[d.icon] || "") + "</span>";
          if (d.type === "feast") html += '<span class="feast-label">THANKSGIVING</span>';
          if (d.type === "movie" && d.movie) html += '<span class="movie-name">' + d.movie.name + "</span>";
          html += '<span class="meal">' + d.meal + "</span>";
          html += '<span class="side">' + d.side + "</span>";
          if (d.tag) html += '<span class="pill">' + d.tag + "</span>";
          if (d.type === "movie") html += '<span class="pill">MOVIE NIGHT</span>';
          btn.innerHTML = html;
          btn.addEventListener("click", function () { openRecipe(current, idx, btn); });
          wrap.appendChild(dow);
          wrap.appendChild(btn);
          grid.appendChild(wrap);
        });
      }

      function btnText(s) { var el = document.createElement("span"); el.innerHTML = s; return el.textContent; }

      prevBtn.addEventListener("click", function () { if (current > 0) { current--; renderWeek(); } });
      nextBtn.addEventListener("click", function () { if (current < WEEKS.length - 1) { current++; renderWeek(); } });

      /* ---------- Recipe popup ---------- */
      var backdrop = document.getElementById("backdrop");
      var modalBody = document.getElementById("modalBody");
      var closeBtn = document.getElementById("modalClose");
      var lastFocus = null;

      function openRecipe(wi, di, fromEl) {
        var d = WEEKS[wi].days[di];
        var r = d.recipe;
        lastFocus = fromEl || null;
        var html = "";
        html += '<div class="m-date">' + d.dow + " &middot; NOVEMBER " + d.date + ", 2026</div>";
        html += '<h2 id="modalTitle">' + d.meal + "</h2>";
        html += '<p class="m-sub">' + d.side + "</p>";
        html += '<div class="chips">'
          + '<div class="chip"><span>Serves</span> ' + r.serves + "</div>"
          + '<div class="chip"><span>Prep</span> ' + r.prep + "</div>"
          + '<div class="chip"><span>Cook</span> ' + r.cook + "</div>"
          + (d.tag ? '<div class="chip">' + d.tag + "</div>" : "")
          + "</div>";
        if (d.type === "movie" && d.movie) {
          html += '<div class="movie-box"><div class="mb-label">FRIDAY MOVIE NIGHT</div>'
            + '<div class="mb-name">' + d.movie.name + " (" + d.movie.year + ")</div>"
            + '<div class="mb-meta">' + d.movie.meta + "</div>"
            + "<p>" + d.movie.blurb + "</p></div>";
        }
        if (d.type === "feast") {
          html += '<div class="movie-box" style="background:linear-gradient(180deg,#ec8a30,#bc550d)"><div class="mb-label" style="color:#ffe3c2">HAPPY THANKSGIVING</div>'
            + '<div class="mb-name" style="color:#fff">The Full Feast</div>'
            + '<div class="mb-meta" style="color:#ffe3c2">Turkey &amp; all the fixings &mdash; sides below</div></div>';
        }
        html += "<h3>INGREDIENTS</h3><ul>";
        r.ingredients.forEach(function (ing) { html += "<li>" + ing + "</li>"; });
        html += "</ul><h3>STEPS</h3><ol>";
        r.steps.forEach(function (s) { html += "<li>" + s + "</li>"; });
        html += "</ol>";
        if (r.sides && r.sides.length) {
          html += "<h3>ON THE SIDE</h3><ul class=\"sides-list\">";
          r.sides.forEach(function (s) { html += "<li><b>" + s.name + "</b> &mdash; <span class=\"how\">" + s.how + "</span></li>"; });
          html += "</ul>";
        }
        modalBody.innerHTML = html;
        backdrop.classList.add("open");
        document.body.style.overflow = "hidden";
        closeBtn.focus();
      }

      function closeRecipe() {
        backdrop.classList.remove("open");
        document.body.style.overflow = "";
        if (lastFocus) lastFocus.focus();
      }

      closeBtn.addEventListener("click", closeRecipe);
      backdrop.addEventListener("click", function (e) { if (e.target === backdrop) closeRecipe(); });
      document.addEventListener("keydown", function (e) { if (e.key === "Escape" && backdrop.classList.contains("open")) closeRecipe(); });

      renderWeek();
    </script>
